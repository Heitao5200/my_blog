<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>黑桃学习之路</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="黑桃的学习笔记：机器学习、深度学习、NLP、大模型、数据库与算法">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/themes/vue.css">
  <!-- KaTeX 的 CSS 与 JS 必须是同一版本，否则公式会渲染错 -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '黑桃学习之路',
      repo: 'https://github.com/Heitao5200/my_blog/',
      loadSidebar: true,
      auto2top: true,
      sidebarDisplayLevel: 0,
      subMaxLevel: 2,
      coverpage: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      pagination: {
        previousText: '上一章节',
        nextText: '下一章节',
      },
      search: {
        placeholder: '搜索',
        noData: '找不到结果！',
      },
      count: {
        countable: true,
        position: 'top',
        margin: '10px',
        float: 'right',
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese',
        isExpected: true
      }
    }
  </script>


  <!-- Put them above docsify.min.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/docsify.min.js"></script>
  <!-- code render-->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3.0.2"></script>
  <!-- KaTeX JS：docsify-katex 调用全局 katex.renderToString()，缺了它公式会显示成原始 $...$ -->
  <script src="//cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@2.0.2/dist/docsify-katex.js"></script>
  <!-- sidebar collapse -->
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse@1.3.5/dist/docsify-sidebar-collapse.min.js"></script>
  <!-- search -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5.0.0/lib/plugins/search.js"></script>
  <!-- count -->
  <script src="//cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.min.js"></script>

</body>

</html>
